<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTEEN MAP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>YTEEN 지도 프로젝트</h1>
    <div id="status-message">
        <p>데이터를 가져오는 중입니다... 잠시만 기다려주세요.</p>
    </div>

    <script>
        // 버셀 환경변수 인식을 우회하여 현재 주소창 기반 혹은 주입된 설정을 안전하게 처리하는 로직
        // 만약 로컬 테스트나 배포 환경에서 주소/키를 직접 명시해야 안전하다면 아래 빈칸에 직접 넣으셔도 됩니다.
        const supabaseUrl = window.process?.env?.NEXT_PUBLIC_SUPABASE_URL || '';
        const supabaseKey = window.process?.env?.NEXT_PUBLIC_SUPABASE_ANON_KEY || '';
        
        let supabase;
        const messageClient = document.getElementById('status-message');

        try {
            // 정석적인 수파베이스 클라이언트 초기화 방식 공식
            supabase = supabase.createClient ? supabase.createClient(supabaseUrl, supabaseKey) : window.supabase.createClient(supabaseUrl, supabaseKey);
        } catch (initError) {
            console.error("수파베이스 초기화 실패:", initError);
            messageClient.innerHTML = `<p style="color:red">초기화 에러: 수파베이스 주소와 키를 확인해주세요.</p>`;
        }

        // yteen_map_2 테이블에서 데이터를 가져오는 함수
        async function loadData() {
            if (!supabase) return;

            const { data, error } = await supabase
                .from('yteen_map_2') // 수파베이스 테이블 이름
                .select('*');

            if (error) {
                console.error("데이터 가져오기 실패:", error);
                messageClient.innerHTML = `<p style="color:red">에러 발생: ${error.message}</p>`;
            } else {
                console.log("성공적으로 가져온 데이터:", data);
                if (data && data.length > 0) {
                    messageClient.innerHTML = `<p style="color:green; font-weight:bold;">🎉 성공! 총 ${data.length}개의 데이터를 정상적으로 가져왔습니다.</p>`;
                } else {
                    messageClient.innerHTML = `<p style="color:orange; font-weight:bold;">⚠️ 연결은 성공했으나, 테이블에 데이터가 존재하지 않습니다. (CSV 업로드 확인 필요)</p>`;
                }
            }
        }

        // 페이지 로드가 끝나면 실행
        if (supabaseUrl && supabaseKey) {
            loadData();
        } else {
            // 만약 버셀 환경변수가 제대로 주입되지 않았을 경우 안내 메시지
            messageClient.innerHTML = `<p style="color:red">환경변수(URL/KEY)가 비어있습니다. Vercel의 Settings -> Environment Variables 설정을 다시 확인한 후 Re-deploy 해주세요.</p>`;
        }
    </script>
</body>
</html>
