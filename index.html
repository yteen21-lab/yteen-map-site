<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTEEN MAP</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Kakao JavaScript Key 사용 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c0dd3bda80a7abb17f5d85b8c9104ea6&autoload=false"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #status-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status-box">
    <b style="font-size: 16px;">YTEEN 지도 프로젝트</b>
    <div id="status-message" style="margin-top: 5px; color: #555;">
      카카오맵을 불러오는 중...
    </div>
  </div>

  <div id="map"></div>

  <script>
    const supabaseUrl = 'https://oqwovisgssxtxwspkztd.supabase.co';
    const supabaseKey = 'sb_publishable_8H_VBzKekLY4Nqq4BPz32Q_uc9tiRis';

    const messageClient = document.getElementById('status-message');

    let map;
    let supabaseClient;

    function setMessage(html) {
      messageClient.innerHTML = html;
    }

    function initMap() {
      const container = document.getElementById('map');

      const options = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 7
      };

      map = new kakao.maps.Map(container, options);
      console.log('카카오맵 생성 완료');
    }

    async function loadDataAndMarkers() {
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
        auth: { persistSession: false }
      });

      const { data, error } = await supabase.from('yteen_map_2').select('*');

      if (error) {
        console.error('데이터 불러오기 실패:', error);
        return;
      }

      console.log('받아온 데이터 전체:', data);

      if (data && data.length > 0) {
        data.forEach(item => {
          console.log('한 개의 데이터:', item);

          const lat = item.latitude;
          const lng = item.longitude;

          if (lat && lng) {
            const position = new kakao.maps.LatLng(lat, lng);
            new kakao.maps.Marker({ map: map, position: position });
          }
        });
      }
    }

    function startApp() {
      initMap();
      loadDataAndMarkers();
    }

    if (window.kakao && kakao.maps) {
      kakao.maps.load(function () {
        startApp();
      });
    } else {
      console.error('Kakao SDK가 로드되지 않았습니다.');
      setMessage(`<span style="color:red; font-weight:bold;">❌ 카카오맵 SDK가 로드되지 않았습니다. JavaScript 키와 도메인 등록을 확인하세요.</span>`);
    }
  </script>
</body>
</html>
