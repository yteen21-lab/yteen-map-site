<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTEEN MAP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>YTEEN 지도 프로젝트</h1>
    <div id="status-message">
        <p>데이터를 가져오는 중입니다... 잠시만 기다려주세요.</p>
    </div>

    <script>
        // ⚠️ [중요] 아래 작은따옴표('') 사이에 수파베이스 대시보드에서 복사한 실제 값을 넣어주세요!
        // 예시: const supabaseUrl = 'https://abcde.supabase.co';
        const supabaseUrl = '여기에_수파베이스_PROJECT_URL_넣기';
        const supabaseKey = '여기에_수파베이스_API_KEY(anon_public)_넣기';
        
        let supabase;
        const messageClient = document.getElementById('status-message');

        try {
            // 수파베이스 초기화
            supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
            
            // 데이터 로드 함수 실행
            loadData();
        } catch (initError) {
            console.error("수파베이스 초기화 실패:", initError);
            messageClient.innerHTML = `<p style="color:red">초기화 에러: 수파베이스 주소와 키를 코드가 읽지 못했습니다.</p>`;
        }

        // yteen_map_2 테이블에서 데이터를 가져오는 함수
        async function loadData() {
            if (!supabase) return;

            const { data, error } = await supabase
                .from('yteen_map_2') // 수파베이스 테이블 이름
                .select('*');

            if (error) {
                console.error("데이터 가져오기 실패:", error);
                messageClient.innerHTML = `<p style="color:red">에러 발생: ${error.message}</p>`;
            } else {
                console.log("성공적으로 가져온 데이터:", data);
                if (data && data.length > 0) {
                    messageClient.innerHTML = `<p style="color:green; font-weight:bold; font-size: 18px;">🎉 성공! 수파베이스 창고에서 총 ${data.length}개의 데이터를 정상적으로 가져왔습니다.</p>`;
                } else {
                    messageClient.innerHTML = `<p style="color:orange; font-weight:bold;">⚠️ 연결은 성공했으나, 테이블이 비어있습니다. 수파베이스 [Table Editor]에서 CSV 파일 업로드를 완료하셨는지 확인해주세요!</p>`;
                }
            }
        }
    </script>
</body>
</html>
