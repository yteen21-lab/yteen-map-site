<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTEEN MAP</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Kakao JavaScript Key 사용 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b7a0d481f33cc856cbf0c82270921025&autoload=false"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #status-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status-box">
    <b style="font-size: 16px;">YTEEN 지도 프로젝트</b>
    <div id="status-message" style="margin-top: 5px; color: #555;">
      카카오맵을 불러오는 중...
    </div>
  </div>

  <div id="map"></div>

  <script>
    const supabaseUrl = 'https://oqwovisgssxtxwspkztd.supabase.co';
    const supabaseKey = 'sb_publishable_8H_VBzKekLY4Nqq4BPz32Q_uc9tiRis';

    const messageClient = document.getElementById('status-message');

    let map;
    let supabaseClient;

    function setMessage(html) {
      messageClient.innerHTML = html;
    }

    function initMap() {
      const container = document.getElementById('map');

      const options = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 7
      };

      map = new kakao.maps.Map(container, options);
      console.log('카카오맵 생성 완료');
    }

    async function loadDataAndMarkers() {
      try {
        setMessage(`<span style="color:#555;">Supabase 데이터를 불러오는 중...</span>`);

        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
          auth: {
            persistSession: false
          }
        });

        const { data, error } = await supabaseClient
          .from('yteen_map_2')
          .select('*');

        console.log('Supabase 응답:', { data, error });

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          setMessage(`<span style="color:orange; font-weight:bold;">⚠️ 연결 성공! 단, 테이블에 데이터가 없습니다.</span>`);
          return;
        }

        setMessage(`<span style="color:green; font-weight:bold;">🎉 학교 ${data.length}개 로드 성공!</span>`);

        let firstPosition = null;

        data.forEach((school) => {
          const name = school.school_name || school.name || '이름 없음';

          const lat = Number(school.latitude ?? school.lat);
          const lng = Number(school.longitude ?? school.lng);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            console.warn('위도/경도 값 오류:', school);
            return;
          }

          const markerPosition = new kakao.maps.LatLng(lat, lng);

          if (!firstPosition) {
            firstPosition = markerPosition;
          }

          const marker = new kakao.maps.Marker({
            position: markerPosition
          });

          marker.setMap(map);

          const infowindow = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px; font-size:12px; text-align:center; white-space:nowrap;">${name}</div>`
          });

          kakao.maps.event.addListener(marker, 'click', function () {
            infowindow.open(map, marker);
          });
        });

        if (firstPosition) {
          map.setCenter(firstPosition);
        } else {
          setMessage(`<span style="color:orange; font-weight:bold;">⚠️ 데이터는 있지만 유효한 위도/경도 값이 없습니다.</span>`);
        }

      } catch (err) {
        console.error('데이터 로드 실패:', err);
        setMessage(`<span style="color:red; font-weight:bold;">❌ 에러: ${err.message}</span>`);
      }
    }

    function startApp() {
      initMap();
      loadDataAndMarkers();
    }

    if (window.kakao && kakao.maps) {
      kakao.maps.load(function () {
        startApp();
      });
    } else {
      console.error('Kakao SDK가 로드되지 않았습니다.');
      setMessage(`<span style="color:red; font-weight:bold;">❌ 카카오맵 SDK가 로드되지 않았습니다. JavaScript 키와 도메인 등록을 확인하세요.</span>`);
    }
  </script>
</body>
</html>
