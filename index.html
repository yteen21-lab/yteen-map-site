<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTEEN MAP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>YTEEN 지도 프로젝트</h1>
    <p>데이터를 가져오는 중입니다... (F12를 눌러 콘솔 창을 확인하세요)</p>

    <script>
        // 1. 아까 버셀에 등록한 환경변수 이름과 똑같이 맞춰서 연동합니다.
        // 버셀이 배포될 때 이 값들을 자동으로 실제 주소와 키로 바꿔치기 해줍니다.
        const supabaseUrl = window.process?.env?.NEXT_PUBLIC_SUPABASE_URL || '';
        const supabaseKey = window.process?.env?.NEXT_PUBLIC_SUPABASE_ANON_KEY || '';
        
        // 만약 환경변수 인식이 어려울 경우를 대비한 수파베이스 초기화
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. yteen_map_2 테이블에서 데이터를 가져오는 함수
        async function loadData() {
            const { data, error } = await supabase
                .from('yteen_map_2') // 수파베이스에 만든 테이블 이름
                .select('*');

            if (error) {
                console.error("데이터 가져오기 실패:", error);
                document.body.innerHTML += `<p style="color:red">에러 발생: ${error.message}</p>`;
            } else {
                console.log("성공적으로 가져온 데이터:", data);
                document.body.innerHTML += `<p style="color:green">성공! 총 ${data.length}개의 데이터를 가져왔습니다.</p>`;
            }
        }

        // 페이지가 켜지면 자동으로 데이터 로드 함수를 실행합니다.
        loadData();
    </script>
</body>
</html>
